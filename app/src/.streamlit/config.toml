[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[server]
runOnSave = true

[theme]
base = "light"
primaryColor = "#0B7A82"
backgroundColor = "#F7FAFC"
secondaryBackgroundColor = "#E8F1F3"
textColor = "#102A43"
linkColor = "#0B7A82"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseRadius = "medium"
buttonRadius = "medium"
borderColor = "#C8D8DE"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0B2545"
secondaryBackgroundColor = "#153A5B"
textColor = "#F7FAFC"
primaryColor = "#F7B32B"
borderColor = "#244E70"
